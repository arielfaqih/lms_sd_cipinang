<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="Segoe UI, Arial, sans-serif">
<defs>
  <marker id="am" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#dc2626"/></marker>
  <marker id="bm" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2563eb"/></marker>
</defs>
<rect width="900" height="560" fill="#fff8f1"/>
<!-- paru-paru -->
<g>
  <path d="M405 70 C350 60 330 120 335 165 C340 200 380 205 410 190 C425 180 425 100 405 70Z" fill="#f9a8b4" stroke="#be4d63" stroke-width="3"/>
  <path d="M495 70 C550 60 570 120 565 165 C560 200 520 205 490 190 C475 180 475 100 495 70Z" fill="#f9a8b4" stroke="#be4d63" stroke-width="3"/>
  <path d="M450 40 V95 M450 95 L420 115 M450 95 L480 115" stroke="#be4d63" stroke-width="6" fill="none" stroke-linecap="round"/>
  <text x="450" y="30" text-anchor="middle" font-size="22" font-weight="800" fill="#7f1d34">PARU-PARU</text>
  <text x="190" y="110" text-anchor="middle" font-size="16" fill="#7f1d34">mengambil oksigen,</text>
  <text x="190" y="130" text-anchor="middle" font-size="16" fill="#7f1d34">melepas karbon dioksida</text>
</g>
<!-- seluruh tubuh -->
<rect x="250" y="440" width="400" height="80" rx="18" fill="#fde68a" stroke="#b45309" stroke-width="3"/>
<text x="450" y="474" text-anchor="middle" font-size="22" font-weight="800" fill="#78350f">SELURUH TUBUH</text>
<text x="450" y="500" text-anchor="middle" font-size="16" fill="#78350f">otak, otot, usus, kulit… menerima oksigen &amp; zat makanan</text>
<!-- peredaran darah kecil -->
<path d="M420 255 C380 240 380 210 395 195" stroke="#2563eb" stroke-width="9" fill="none" marker-end="url(#bm)"/>
<path d="M505 195 C520 215 520 240 480 255" stroke="#dc2626" stroke-width="9" fill="none" marker-end="url(#am)"/>
<!-- peredaran darah besar -->
<path d="M490 320 C640 330 700 380 640 440" stroke="#dc2626" stroke-width="9" fill="none" marker-end="url(#am)"/>
<path d="M260 440 C200 380 260 330 410 320" stroke="#2563eb" stroke-width="9" fill="none" marker-end="url(#bm)"/>
<!-- jantung -->
<path d="M450 345 C390 305 380 265 410 248 C430 237 447 250 450 262 C453 250 470 237 490 248 C520 265 510 305 450 345Z" fill="#dc2626" stroke="#7f1d1d" stroke-width="3"/>
<text x="450" y="292" text-anchor="middle" font-size="18" font-weight="800" fill="#fff">JANTUNG</text>
<text x="450" y="410" text-anchor="middle" font-size="15" fill="#7f1d1d">memompa darah ±70–110 kali per menit saat istirahat</text>
<!-- label jalur -->
<g font-size="17" font-weight="700">
  <text x="610" y="210" fill="#111827">Peredaran darah KECIL</text>
  <text x="610" y="232" font-weight="400" fill="#374151">jantung → paru-paru → jantung</text>
  <text x="690" y="350" fill="#111827">Peredaran darah BESAR</text>
  <text x="690" y="372" font-weight="400" fill="#374151">jantung → seluruh tubuh</text>
  <text x="690" y="392" font-weight="400" fill="#374151">→ jantung</text>
</g>
<g font-size="15" fill="#374151">
  <text x="160" y="300" text-anchor="middle">pembuluh balik (vena)</text>
  <text x="160" y="318" text-anchor="middle">menuju jantung</text>
  <text x="760" y="455" text-anchor="middle">pembuluh nadi (arteri)</text>
  <text x="760" y="473" text-anchor="middle">keluar dari jantung</text>
</g>
<!-- keterangan warna -->
<g font-size="15">
  <rect x="20" y="20" width="22" height="10" fill="#dc2626"/><text x="50" y="30" fill="#111827">banyak oksigen</text>
  <rect x="20" y="42" width="22" height="10" fill="#2563eb"/><text x="50" y="52" fill="#111827">sedikit oksigen</text>
  <text x="20" y="545" fill="#6b7280">Warna biru hanya penanda. Darah kita selalu berwarna merah.</text>
</g>
</svg>
