<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Animasi Peredaran Darah Manusia</title>
<style>
  html,body{margin:0;height:100%;font-family:"Segoe UI",system-ui,Arial,sans-serif;background:#fff8f1;color:#1f2937}
  .app{display:flex;flex-direction:column;height:100%;padding:10px;box-sizing:border-box;gap:8px}
  .top{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px}
  .st{font-size:clamp(15px,2.6vw,26px);font-weight:800}
  .bpm{font-size:clamp(15px,2.6vw,26px);font-weight:800;color:#b91c1c;font-variant-numeric:tabular-nums}
  canvas{flex:1;min-height:120px;width:100%;height:100%;border-radius:14px;background:#fff}
  .ctrl{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
  button{font:inherit;font-weight:700;border:2px solid #e5e7eb;border-radius:12px;padding:6px 12px;cursor:pointer;background:#fff;color:#1f2937;font-size:clamp(13px,1.8vw,17px)}
  button.on{background:#b91c1c;border-color:#b91c1c;color:#fff}
  .sep{width:1px;height:26px;background:#e5e7eb;margin:0 2px}
  .note{font-size:clamp(11px,1.5vw,14px);color:#6b7280}
</style></head>
<body><div class="app">
  <div class="top"><div class="st" id="st">Semua jalur peredaran darah</div><div class="bpm" id="bpm">♥ 80 kali/menit</div></div>
  <canvas id="c" aria-label="Animasi darah mengalir dari jantung ke paru-paru dan ke seluruh tubuh"></canvas>
  <div class="ctrl">
    <button data-jalur="semua" class="on">Semua</button>
    <button data-jalur="kecil">Peredaran kecil</button>
    <button data-jalur="besar">Peredaran besar</button>
    <span class="sep"></span>
    <button data-keadaan="diam" class="on">😌 Istirahat</button>
    <button data-keadaan="lari">🏃 Setelah berlari</button>
  </div>
  <div class="note">Merah = banyak oksigen, biru = sedikit oksigen (hanya penanda; darah selalu merah).</div>
</div>
<script>
(function(){
  // Semua gambar memakai bidang logis 1000 × 640 yang diperkecil/diperbesar utuh (proporsi tetap).
  var LW=1000,LH=640;
  var c=document.getElementById('c'),x=c.getContext('2d'),W,H,D=window.devicePixelRatio||1;
  var jalur='semua',bpm=80,t=0,last=0,beat=0;
  function size(){var r=c.getBoundingClientRect();W=c.width=Math.max(1,r.width*D);H=c.height=Math.max(1,r.height*D);}
  size();window.addEventListener('resize',size);
  var JX=500,JY=330;
  var kecil=[[470,300],[370,260],[360,150],[440,100],[560,100],[640,150],[630,260],[530,300]];
  var besar=[[545,355],[800,380],[860,520],[650,592],[350,592],[140,520],[200,380],[455,355]];
  function pt(p,f){var n=p.length-1,s=f*n,i=Math.min(Math.floor(s),n-1),u=s-i;return[p[i][0]+(p[i+1][0]-p[i][0])*u,p[i][1]+(p[i+1][1]-p[i][1])*u];}
  function garis(p,col,a){x.globalAlpha=a;x.strokeStyle=col;x.lineWidth=14;x.lineJoin='round';x.lineCap='round';x.beginPath();p.forEach(function(q,i){i?x.lineTo(q[0],q[1]):x.moveTo(q[0],q[1]);});x.stroke();x.globalAlpha=1;}
  function teks(s,px,py,size,col,bold,al){x.fillStyle=col;x.font=(bold?'800 ':'600 ')+size+'px Segoe UI, Arial';x.textAlign=al||'center';x.fillText(s,px,py);}
  function tampil(n){return jalur==='semua'||jalur===n;}
  function frame(now){
    var dt=Math.min(50,now-(last||now));last=now;
    t+=dt*bpm/80/9000;beat+=dt*bpm/60000;
    x.setTransform(1,0,0,1,0,0);x.clearRect(0,0,W,H);
    var s=Math.min(W/LW,H/LH);x.setTransform(s,0,0,s,(W-LW*s)/2,(H-LH*s)/2);
    // paru-paru dan tubuh
    x.fillStyle='#f9a8b4';x.strokeStyle='#be4d63';x.lineWidth=4;
    [[430,140],[570,140]].forEach(function(p){x.beginPath();x.ellipse(p[0],p[1],62,85,0,0,7);x.fill();x.stroke();});
    teks('PARU-PARU',500,40,30,'#7f1d34',true);
    x.fillStyle='#fde68a';x.strokeStyle='#b45309';x.beginPath();x.rect(300,515,400,110);x.fill();x.stroke();
    teks('SELURUH TUBUH',500,560,30,'#78350f',true);
    var ak=tampil('kecil')?1:.12,ab=tampil('besar')?1:.12;
    garis(kecil.slice(0,4),'#2563eb',ak*.35);garis(kecil.slice(4),'#dc2626',ak*.35);
    garis(besar.slice(0,4),'#dc2626',ab*.35);garis(besar.slice(4),'#2563eb',ab*.35);
    // sel darah: biru sebelum paru-paru / setelah tubuh
    [[kecil,'kecil',true],[besar,'besar',false]].forEach(function(a){
      if(!tampil(a[1]))return;
      for(var i=0;i<16;i++){var f=(t+i/16)%1,p=pt(a[0],f),biru=a[2]?f<.5:f>=.5;
        x.fillStyle=biru?'#2563eb':'#dc2626';x.beginPath();x.arc(p[0],p[1],10,0,7);x.fill();}
    });
    // jantung berdenyut
    var k=1+.1*Math.pow(Math.max(0,Math.sin(beat*Math.PI*2)),8);
    x.save();x.translate(JX,JY);x.scale(k,k);
    x.fillStyle='#dc2626';x.strokeStyle='#7f1d1d';x.lineWidth=4;x.beginPath();
    x.moveTo(0,58);x.bezierCurveTo(-80,12,-82,-46,-38,-56);x.bezierCurveTo(-16,-61,-3,-46,0,-34);
    x.bezierCurveTo(3,-46,16,-61,38,-56);x.bezierCurveTo(82,-46,80,12,0,58);x.fill();x.stroke();
    teks('JANTUNG',0,6,22,'#fff',true);x.restore();
    if(tampil('kecil')){teks('Peredaran kecil:',690,190,28,'#1f2937',true,'left');teks('jantung → paru-paru',690,224,24,'#374151',false,'left');teks('→ jantung',690,256,24,'#374151',false,'left');}
    if(tampil('besar')){teks('Peredaran besar:',20,280,28,'#1f2937',true,'left');teks('jantung → tubuh',20,314,24,'#374151',false,'left');teks('→ jantung',20,346,24,'#374151',false,'left');}
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
  var judul={semua:'Semua jalur peredaran darah',kecil:'Peredaran darah kecil: mengambil oksigen di paru-paru',besar:'Peredaran darah besar: mengantar oksigen ke seluruh tubuh'};
  function pilih(attr,b){Array.prototype.forEach.call(document.querySelectorAll('['+attr+']'),function(o){o.classList.toggle('on',o===b);});}
  Array.prototype.forEach.call(document.querySelectorAll('[data-jalur]'),function(b){b.onclick=function(){jalur=b.dataset.jalur;document.getElementById('st').textContent=judul[jalur];pilih('data-jalur',b);};});
  Array.prototype.forEach.call(document.querySelectorAll('[data-keadaan]'),function(b){b.onclick=function(){bpm=b.dataset.keadaan==='lari'?130:80;document.getElementById('bpm').textContent='♥ '+bpm+' kali/menit';pilih('data-keadaan',b);};});
})();
</script>
</body></html>
