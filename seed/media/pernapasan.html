<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sistem Pernapasan Manusia</title>
<style>
  [hidden]{display:none!important}
  html,body{margin:0;height:100%;font-family:"Segoe UI",system-ui,Arial,sans-serif;background:#f0f9ff;color:#0c4a6e}
  .app{display:flex;flex-direction:column;height:100%;padding:10px;box-sizing:border-box;gap:8px}
  .row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  button{font:inherit;font-weight:700;border:2px solid #bae6fd;background:#fff;border-radius:12px;padding:7px 12px;cursor:pointer;font-size:clamp(13px,1.8vw,17px);color:#0c4a6e}
  button.on{background:#0284c7;border-color:#0284c7;color:#fff}
  .main{flex:1;min-height:0;display:flex;gap:12px}
  svg{flex:1.1;min-width:0;width:100%;height:100%}
  .org{cursor:pointer}
  .org:hover{filter:brightness(1.08)}
  .panel{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px;overflow:auto}
  .fase{font-size:clamp(20px,3.2vw,32px);font-weight:900}
  .box{background:#fff;border:2px solid #bae6fd;border-radius:14px;padding:9px 12px;font-size:clamp(13px,1.9vw,18px);line-height:1.42;color:#1f2937}
  .box h3{margin:0 0 4px;color:#0369a1;font-size:clamp(14px,2vw,19px)}
  .lg{font-size:clamp(12px,1.6vw,15px);color:#475569}
  @media (max-width:700px){.main{flex-direction:column}}
</style></head>
<body><div class="app">
  <div class="row">
    <button id="tarik">⬇ Tarik napas</button><button id="hembus">⬆ Hembuskan</button><button id="oto" class="on">▶ Bernapas otomatis</button>
    <span style="width:8px"></span><button data-laju="20" class="on">😌 Istirahat</button><button data-laju="40">🏃 Setelah berlari</button>
  </div>
  <div class="main">
    <svg viewBox="0 0 600 560" aria-label="Gambar saluran pernapasan">
      <path d="M150 170 Q300 120 450 170 L470 470 Q300 520 130 470Z" fill="#ffe4d6" stroke="#e7a98a" stroke-width="3"/>
      <circle cx="300" cy="70" r="55" fill="#fcd5bf" stroke="#e7a98a" stroke-width="3"/>
      <g id="rusuk" stroke="#e2c2b0" stroke-width="6" fill="none" stroke-linecap="round"></g>
      <g class="org" data-o="hidung"><path d="M300 60 L288 92 L312 92Z" fill="#f59e0b"/><text x="345" y="80" font-size="18" font-weight="700" fill="#92400e">hidung</text></g>
      <g class="org" data-o="trakea"><path d="M290 110 V250 M310 110 V250" stroke="#0ea5e9" stroke-width="7"/><rect x="291" y="112" width="18" height="138" fill="#bae6fd"/>
        <text x="320" y="180" font-size="17" font-weight="700" fill="#0369a1">tenggorokan (trakea)</text></g>
      <g id="paruKiri" class="org" data-o="paru"><ellipse cx="220" cy="330" rx="72" ry="112" fill="#fda4af" stroke="#be123c" stroke-width="4"/></g>
      <g id="paruKanan" class="org" data-o="paru"><ellipse cx="380" cy="330" rx="72" ry="112" fill="#fda4af" stroke="#be123c" stroke-width="4"/></g>
      <g class="org" data-o="bronkus" stroke="#0ea5e9" stroke-width="10" fill="none" stroke-linecap="round"><path d="M300 248 Q270 268 240 300"/><path d="M300 248 Q330 268 360 300"/>
        <path d="M240 300 L215 330 M240 300 L250 345 M360 300 L385 330 M360 300 L350 345" stroke-width="5"/></g>
      <text x="78" y="335" text-anchor="middle" font-size="17" font-weight="700" fill="#9f1239">paru-paru</text>
      <path d="M118 330 H150" stroke="#9f1239" stroke-width="2"/>
      <path id="diafragma" class="org" data-o="diafragma" d="" fill="none" stroke="#7c3aed" stroke-width="12" stroke-linecap="round"/>
      <text x="470" y="530" text-anchor="end" font-size="17" font-weight="700" fill="#6d28d9">diafragma</text>
      <g id="partikel"></g>
    </svg>
    <div class="panel">
      <div class="fase" id="fase">Menarik napas</div>
      <div class="box" id="jelas"></div>
      <div class="box" id="info"><h3>Ketuk bagian tubuh pada gambar</h3>untuk melihat fungsinya.</div>
      <div class="lg"><b style="color:#2563eb">●</b> oksigen (O₂) masuk · <b style="color:#64748b">●</b> karbon dioksida (CO₂) keluar · <span id="laju">± 20 kali napas per menit</span></div>
    </div>
  </div>
</div>
<script>
(function(){
  var INFO={
    hidung:['Hidung','Jalan masuk udara. Rambut dan lendir hidung menyaring debu; udara juga dihangatkan dan dilembapkan.'],
    trakea:['Tenggorokan (trakea)','Saluran udara dari hidung menuju paru-paru. Dindingnya berlendir untuk menangkap kotoran.'],
    bronkus:['Cabang tenggorokan (bronkus)','Bercabang ke paru-paru kanan dan kiri, lalu bercabang lagi makin kecil.'],
    paru:['Paru-paru','Di dalamnya ada jutaan gelembung paru (alveolus). Di sinilah oksigen masuk ke darah dan karbon dioksida keluar dari darah.'],
    diafragma:['Diafragma','Otot sekat antara rongga dada dan perut. Saat diafragma mengerut dan turun, rongga dada membesar sehingga udara masuk.']
  };
  var p=0,target=1,oto=true,laju=20,lastSwitch=0,part=[];
  var svgNS='http://www.w3.org/2000/svg',rusuk=document.getElementById('rusuk');
  for(var i=0;i<5;i++){var r=document.createElementNS(svgNS,'path');r.dataset.i=i;rusuk.appendChild(r);}
  function gambar(){
    var s=1+0.13*p;
    ['paruKiri','paruKanan'].forEach(function(id){var el=document.getElementById(id);el.setAttribute('transform','translate('+(id==='paruKiri'?220:380)+' 330) scale('+s+') translate('+(id==='paruKiri'?-220:-380)+' -330)');});
    var cy=405-50*(1-p)+0;// dada: kubah naik saat menghembuskan
    document.getElementById('diafragma').setAttribute('d','M150 '+(455+10*p)+' Q300 '+(cy+40*p)+' 450 '+(455+10*p));
    Array.prototype.forEach.call(rusuk.children,function(r){var i=+r.dataset.i,y=200+i*48,w=135+i*6+12*p;
      r.setAttribute('d','M'+(300-w)+' '+(y+20)+' Q300 '+(y-18-6*p)+' '+(300+w)+' '+(y+20));});
    document.getElementById('fase').textContent=target===1?'⬇ Menarik napas (inspirasi)':'⬆ Menghembuskan napas (ekspirasi)';
    document.getElementById('jelas').innerHTML=target===1?
      'Diafragma <b>mengerut dan turun</b>, tulang rusuk <b>terangkat</b>. Rongga dada membesar sehingga udara kaya <b>oksigen</b> masuk ke paru-paru.':
      'Diafragma <b>mengendur dan naik</b>, tulang rusuk <b>turun</b>. Rongga dada mengecil sehingga udara berisi <b>karbon dioksida</b> terdorong keluar.';
  }
  function tambahPartikel(masuk){var g=document.getElementById('partikel'),c=document.createElementNS(svgNS,'circle');c.setAttribute('r',7);c.setAttribute('fill',masuk?'#2563eb':'#64748b');g.appendChild(c);
    part.push({el:c,t:0,masuk:masuk,sisi:Math.random()<.5?-1:1});}
  function posisi(q){var tt=Math.max(0,Math.min(1,q.t)),t=q.masuk?tt:1-tt;var pts=[[300,40],[300,95],[300,250],[300+q.sisi*70,320]],n=pts.length-1,s=t*n,i=Math.min(Math.floor(s),n-1),u=s-i;
    return[pts[i][0]+(pts[i+1][0]-pts[i][0])*u,pts[i][1]+(pts[i+1][1]-pts[i][1])*u];}
  var last=0,acc=0;
  function frame(now){var dt=Math.min(50,now-(last||now));last=now;
    var setengah=60000/laju/2;
    if(oto&&now-lastSwitch>setengah){target=1-target;lastSwitch=now;}
    p+=(target-p)*Math.min(1,dt/(setengah*0.35));
    acc+=dt;if(acc>setengah/6){acc=0;tambahPartikel(target===1);}
    part.forEach(function(q){q.t+=dt/(setengah*0.9);var xy=posisi(q);q.el.setAttribute('cx',xy[0]);q.el.setAttribute('cy',xy[1]);q.el.setAttribute('opacity',q.t>0.9?Math.max(0,(1-q.t)*10):1);});
    part=part.filter(function(q){if(q.t>=1){q.el.remove();return false;}return true;});
    gambar();requestAnimationFrame(frame);}
  requestAnimationFrame(frame);
  function manual(t){oto=false;document.getElementById('oto').classList.remove('on');target=t;}
  document.getElementById('tarik').onclick=function(){manual(1);};
  document.getElementById('hembus').onclick=function(){manual(0);};
  document.getElementById('oto').onclick=function(){oto=!oto;this.classList.toggle('on',oto);};
  Array.prototype.forEach.call(document.querySelectorAll('[data-laju]'),function(b){b.onclick=function(){laju=+b.dataset.laju;
    Array.prototype.forEach.call(document.querySelectorAll('[data-laju]'),function(o){o.classList.toggle('on',o===b);});
    document.getElementById('laju').textContent=laju===20?'± 20 kali napas per menit (istirahat)':'± 40 kali napas per menit (setelah berlari: tubuh butuh lebih banyak oksigen)';};});
  Array.prototype.forEach.call(document.querySelectorAll('.org'),function(o){o.addEventListener('click',function(){var i=INFO[o.dataset.o];document.getElementById('info').innerHTML='<h3>'+i[0]+'</h3>'+i[1];});});
  gambar();
})();
</script>
</body></html>
