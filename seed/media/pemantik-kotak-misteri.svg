<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" font-family="Segoe UI, Arial, sans-serif">
<style>
.bob{animation:bob 2.4s ease-in-out infinite}
.bob2{animation:bob 2.4s ease-in-out -1.2s infinite}
.bobf{animation:bob .5s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-12px)}}
.q{animation:q 1.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes q{0%,100%{transform:rotate(-8deg) scale(1)}50%{transform:rotate(8deg) scale(1.12)}}
.blink{animation:blink 2s ease-in-out infinite}
.blink2{animation:blink 2.6s ease-in-out -1s infinite}
.blink3{animation:blink 1.7s ease-in-out -.5s infinite}
@keyframes blink{50%{opacity:.15}}
.spin{animation:spin 10s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes spin{to{transform:rotate(360deg)}}
.wob{animation:wob 1.4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes wob{0%,100%{transform:rotate(0)}25%{transform:rotate(-3deg)}75%{transform:rotate(3deg)}}
.rise{animation:rise 2.4s ease-out infinite}
.rise2{animation:rise 2.4s ease-out -.8s infinite}
.rise3{animation:rise 2.4s ease-out -1.6s infinite}
@keyframes rise{0%{transform:translateY(0);opacity:0}30%{opacity:1}100%{transform:translateY(-70px);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
