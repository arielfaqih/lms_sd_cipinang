<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Biotik dan Abiotik</title>
<style>
  [hidden]{display:none!important}
  html,body{margin:0;height:100%;font-family:"Segoe UI",system-ui,Arial,sans-serif;background:#f7fee7;color:#1a2e05}
  .app{display:flex;flex-direction:column;height:100%;padding:10px;box-sizing:border-box;gap:8px}
  .tabs{display:flex;gap:6px;flex-wrap:wrap}
  button{font:inherit;font-weight:700;border:2px solid #d9f99d;background:#fff;border-radius:12px;padding:7px 12px;cursor:pointer;font-size:clamp(13px,1.8vw,17px);color:#1a2e05}
  .tabs button.on{background:#4d7c0f;border-color:#4d7c0f;color:#fff}
  .area{flex:1;min-height:0;overflow:auto}
  .pilah{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
  .kartu{background:#fff;border:3px solid #d9f99d;border-radius:20px;padding:12px 26px}
  .kartu .em{font-size:clamp(52px,10vw,96px);line-height:1.1}
  .kartu b{font-size:clamp(20px,3vw,30px)}
  .dua{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
  .dua button{font-size:clamp(17px,2.6vw,26px);font-weight:900;color:#fff;border:0;border-radius:18px;padding:12px 22px;box-shadow:0 6px 0 rgba(0,0,0,.2)}
  .dua button:disabled{opacity:.4}
  .bio{background:#16a34a}.abio{background:#0369a1}
  .fb{font-size:clamp(15px,2.2vw,21px);min-height:2.6em;max-width:820px;line-height:1.4}
  .kolom{display:flex;gap:10px;width:100%;max-width:900px}
  .kolom div{flex:1;background:#fff;border-radius:14px;border:2px dashed #d9f99d;padding:6px;min-height:46px;font-size:clamp(20px,3vw,30px)}
  .kolom small{display:block;font-size:13px;font-weight:800}
  .lab{display:flex;gap:12px;height:100%}
  .lab svg{flex:1;min-width:0;height:100%;background:#fff;border-radius:16px}
  .ctrl{flex:1;min-width:0;display:flex;flex-direction:column;gap:10px}
  .ctrl label{display:flex;flex-direction:column;font-weight:800;font-size:clamp(14px,2vw,18px)}
  input[type=range]{width:100%;accent-color:#4d7c0f}
  .hasil{background:#fff;border:2px solid #d9f99d;border-radius:14px;padding:9px 12px;font-size:clamp(13px,1.9vw,18px);line-height:1.4}
  @media (max-width:700px){.lab{flex-direction:column}.lab svg{min-height:220px}}
</style></head>
<body><div class="app">
  <div class="tabs"><button class="on" data-t="pilah">🔎 Pilah komponen</button><button data-t="lab">🌱 Percobaan tanaman</button></div>
  <div class="area pilah" id="pilah">
    <div class="kartu" id="kartu"></div>
    <div class="dua"><button class="bio" data-v="1">🌿 Biotik (makhluk hidup)</button><button class="abio" data-v="0">🪨 Abiotik (tak hidup)</button></div>
    <div class="fb" id="fb">Komponen ekosistem ini termasuk biotik atau abiotik?</div>
    <div class="kolom"><div id="kB"><small>BIOTIK</small></div><div id="kA"><small>ABIOTIK</small></div></div>
  </div>
  <div class="area" id="lab" hidden>
    <div class="lab">
      <svg viewBox="0 0 400 380" id="pot" aria-label="Tanaman dalam pot"></svg>
      <div class="ctrl">
        <label>☀️ Cahaya matahari <input type="range" id="cahaya" min="0" max="100" value="70"></label>
        <label>💧 Air yang disiramkan <input type="range" id="air" min="0" max="100" value="55"></label>
        <label>🟫 Tanah <select id="tanah" style="font:inherit;padding:6px;border-radius:10px"><option value="1">Tanah gembur & subur (ada cacing)</option><option value="0.6">Tanah keras & tandus</option></select></label>
        <button id="amati" style="background:#4d7c0f;color:#fff;border-color:#4d7c0f">▶ Amati selama 7 hari</button>
        <div class="hasil" id="hasil">Atur cahaya, air, dan tanah (komponen <b>abiotik</b>), lalu amati pertumbuhan tanaman (komponen <b>biotik</b>).</div>
      </div>
    </div>
  </div>
</div>
<script>
(function(){
  var K=[['🐟','Ikan',1],['🌾','Padi',1],['💧','Air',0],['🪨','Batu',0],['☀️','Cahaya matahari',0],['🐸','Katak',1],['🍄','Jamur',1],['🟫','Tanah',0],['💨','Udara',0],['🪱','Cacing tanah',1],['🌡️','Suhu',0],['🦆','Bebek',1]];
  for(var i=K.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=K[i];K[i]=K[j];K[j]=t;}
  var n=0,btn=document.querySelectorAll('.dua button');
  function tampil(){var k=K[n];document.getElementById('kartu').innerHTML='<div class="em">'+k[0]+'</div><b>'+k[1]+'</b>';
    Array.prototype.forEach.call(btn,function(b){b.disabled=false;});}
  Array.prototype.forEach.call(btn,function(b){b.onclick=function(){var k=K[n],ok=(+b.dataset.v)===k[2];
    Array.prototype.forEach.call(btn,function(x){x.disabled=true;});
    document.getElementById(k[2]?'kB':'kA').insertAdjacentHTML('beforeend','<span title="'+k[1]+'">'+k[0]+'</span>');
    document.getElementById('fb').innerHTML='<b style="color:'+(ok?'#15803d':'#b91c1c')+'">'+(ok?'Benar!':'Belum tepat.')+'</b> '+k[1]+' termasuk <b>'+(k[2]?'biotik':'abiotik')+'</b> karena '+(k[2]?'ia makhluk hidup: tumbuh, bernapas, dan berkembang biak.':'ia bukan makhluk hidup.');
    setTimeout(function(){if(n<K.length-1){n++;tampil();}else{document.getElementById('kartu').innerHTML='<div class="em">🏞️</div><b>Semua sudah dipilah!</b>';
      document.getElementById('fb').innerHTML='Komponen biotik dan abiotik saling membutuhkan. Coba buktikan di tab <b>Percobaan tanaman</b>.';}},1800);};});
  tampil();

  // Percobaan: abiotik (cahaya, air, tanah) memengaruhi biotik (tanaman)
  var pot=document.getElementById('pot'),hari=7,anim=null;
  function nilai(){var c=+document.getElementById('cahaya').value/100,a=+document.getElementById('air').value,s=+document.getElementById('tanah').value;
    // Kurang cahaya → etiolasi: batang memanjang, kurus, pucat, daun kecil (mencari cahaya)
    var fa=Math.max(0,1-Math.abs(a-55)/55),kuatCahaya=Math.min(1,c*1.4);
    return{c:c,a:a,s:s,daunSkala:0.45+0.55*kuatCahaya,g:Math.max(0.05,(c<0.25?1.1:0.55+0.45*kuatCahaya)*fa*s)};}
  function gambar(h){var v=nilai(),tinggi=20+180*Math.min(1.1,v.g)*(h/7),layu=v.a<12||v.a>92,pucat=v.c<0.25;
    var daun=pucat?'#d9f99d':'#16a34a',batang=pucat?'#ecfccb':'#15803d',miring=layu?28*(h/7):0,svg='';
    svg+='<rect width="400" height="380" fill="'+(v.c>0.5?'#e0f2fe':v.c>0.2?'#cbd5e1':'#64748b')+'"/>';
    svg+='<circle cx="350" cy="50" r="'+(10+30*v.c)+'" fill="#fbbf24" opacity="'+(0.2+0.8*v.c)+'"/>';
    for(var i=0;i<Math.round(v.a/20);i++)svg+='<path d="M'+(70+i*22)+' 60 l-6 14 a7 7 0 1 0 12 0z" fill="#38bdf8"/>';
    svg+='<path d="M120 300 L280 300 L260 370 L140 370Z" fill="#b45309"/><rect x="112" y="290" width="176" height="18" rx="6" fill="#92400e"/>';
    svg+='<ellipse cx="200" cy="300" rx="80" ry="8" fill="'+(v.s>0.9?'#57534e':'#a8a29e')+'"/>';
    svg+='<g transform="rotate('+miring+' 200 300)"><path d="M200 300 V'+(300-tinggi)+'" stroke="'+batang+'" stroke-width="'+(pucat?3:7)+'"/>';
    var nd=Math.max(1,Math.floor(tinggi/40)),rx=26*v.daunSkala;for(var k=0;k<nd;k++){var y=300-tinggi*(k+1)/(nd+0.5),sisi=k%2?1:-1;
      svg+='<ellipse cx="'+(200+sisi*rx)+'" cy="'+y+'" rx="'+rx+'" ry="'+(11*v.daunSkala)+'" fill="'+daun+'" transform="rotate('+(sisi*-25+(layu?sisi*40:0))+' '+(200+sisi*26)+' '+y+')"/>';}
    svg+='</g><text x="200" y="30" text-anchor="middle" font-size="20" font-weight="800" fill="#1a2e05">Hari ke-'+h+' · tinggi ± '+Math.round(tinggi/10)+' cm</text>';
    pot.innerHTML=svg;return v;}
  function simpulan(v){var t=[];
    if(v.c<0.25)t.push('Tanaman tumbuh <b>tinggi tetapi kurus, pucat, dan berdaun kecil</b> karena kurang cahaya: batangnya memanjang mencari cahaya. Tumbuhan butuh cahaya untuk membuat makanan.');
    if(v.a<12)t.push('Tanaman <b>layu</b> karena kekurangan air.');
    if(v.a>92)t.push('Tanaman <b>layu</b> karena terlalu banyak air: akarnya busuk dan tidak bisa bernapas.');
    if(v.s<0.9)t.push('Tanah tandus membuat tanaman tumbuh lambat. Cacing tanah (biotik) membantu menggemburkan tanah.');
    if(!t.length)t.push('Tanaman tumbuh <b>subur</b>! Cahaya, air, dan tanah yang cukup membuatnya sehat.');
    t.push('<br><b>Kesimpulan:</b> komponen abiotik memengaruhi komponen biotik, dan sebaliknya.');
    document.getElementById('hasil').innerHTML=t.join(' ');}
  document.getElementById('amati').onclick=function(){if(anim)clearInterval(anim);var h=0;anim=setInterval(function(){h++;var v=gambar(h);if(h>=7){clearInterval(anim);simpulan(v);}},350);};
  ['cahaya','air','tanah'].forEach(function(id){document.getElementById(id).oninput=function(){if(anim)clearInterval(anim);gambar(0);document.getElementById('hasil').innerHTML='Tekan <b>Amati selama 7 hari</b> untuk melihat hasilnya.';};});
  gambar(7);simpulan(nilai());
  Array.prototype.forEach.call(document.querySelectorAll('[data-t]'),function(b){b.onclick=function(){
    Array.prototype.forEach.call(document.querySelectorAll('[data-t]'),function(o){o.classList.toggle('on',o===b);});
    document.getElementById('pilah').hidden=b.dataset.t!=='pilah';document.getElementById('lab').hidden=b.dataset.t!=='lab';};});
})();
</script>
</body></html>
