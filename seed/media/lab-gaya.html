<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lab Gaya</title>
<style>
  [hidden]{display:none!important}
  html,body{margin:0;height:100%;font-family:"Segoe UI",system-ui,Arial,sans-serif;background:#eff6ff;color:#0f172a}
  .app{display:flex;flex-direction:column;height:100%;padding:10px;box-sizing:border-box;gap:8px}
  .row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  button,select{font:inherit;font-weight:700;border:2px solid #bfdbfe;background:#fff;border-radius:12px;padding:6px 12px;cursor:pointer;font-size:clamp(13px,1.8vw,17px);color:#0f172a}
  .tabs button.on{background:#2563eb;border-color:#2563eb;color:#fff}
  .aksi button{background:#1e3a8a;border-color:#1e3a8a;color:#fff}
  canvas{flex:1;min-height:150px;width:100%;border-radius:14px;background:#fff}
  .ket{background:#fff;border:2px solid #bfdbfe;border-radius:14px;padding:8px 12px;font-size:clamp(13px,1.9vw,18px);line-height:1.4}
  input[type=range]{width:160px;accent-color:#2563eb}
</style></head>
<body><div class="app">
  <div class="row tabs" id="tabs"></div>
  <div class="row aksi" id="aksi"></div>
  <canvas id="c"></canvas>
  <div class="ket" id="ket"></div>
</div>
<script>
(function(){
  var LW=1000,LH=460,GROUND=380;
  var c=document.getElementById('c'),x=c.getContext('2d'),W,H,D=window.devicePixelRatio||1;
  function size(){var r=c.getBoundingClientRect();W=c.width=Math.max(1,r.width*D);H=c.height=Math.max(1,r.height*D);}
  size();window.addEventListener('resize',size);
  var tab='otot',st={};
  var T={
    otot:{n:'💪 Dorong & tarik',k:'<b>Gaya otot</b> adalah gaya dari tenaga otot kita. Dorongan dan tarikan dapat membuat benda <b>diam menjadi bergerak</b>, <b>bergerak menjadi diam</b>, dan <b>mengubah arah gerak</b>. Coba dorong kotak, lalu tarik saat kotak masih bergerak.'},
    gesek:{n:'🧊 Gaya gesek',k:'<b>Gaya gesek</b> terjadi saat dua permukaan bergesekan dan arahnya melawan gerak. Dorong kotak dengan kekuatan yang sama di permukaan berbeda. Permukaan <b>kasar</b> (pasir, karpet) membuat gaya gesek <b>besar</b> sehingga kotak cepat berhenti.'},
    magnet:{n:'🧲 Gaya magnet',k:'<b>Gaya magnet</b> menarik benda dari <b>besi atau baja</b> (paku, peniti, klip kertas) tanpa menyentuhnya. Benda dari kayu, plastik, karet, dan aluminium tidak tertarik. Geser magnet mendekati benda-benda.'},
    gravitasi:{n:'🌍 Gravitasi',k:'<b>Gaya gravitasi</b> adalah tarikan Bumi yang membuat benda jatuh ke bawah. Bola jatuh cepat. Daun jatuh lebih lambat dan melayang karena tertahan udara.'},
    bentuk:{n:'🫓 Mengubah bentuk',k:'Gaya juga dapat <b>mengubah bentuk</b> benda. Plastisin yang ditekan menjadi pipih, dan yang ditarik menjadi panjang. Contoh lain: adonan roti diuleni, kaleng bekas diinjak.'}
  };
  var tabsEl=document.getElementById('tabs');
  Object.keys(T).forEach(function(k){var b=document.createElement('button');b.textContent=T[k].n;b.dataset.k=k;b.onclick=function(){pilih(k);};tabsEl.appendChild(b);});
  var PERMUKAAN={es:['Es','#e0f2fe',0.06],keramik:['Lantai keramik','#f1f5f9',0.2],karpet:['Karpet','#fecaca',0.5],pasir:['Pasir','#fde68a',1.0]};
  var BENDA=[['Paku','#64748b',1],['Penghapus','#f472b6',0],['Peniti','#94a3b8',1],['Pensil kayu','#f59e0b',0],['Klip kertas','#475569',1],['Kaleng aluminium','#cbd5e1',0],['Sendok plastik','#22c55e',0]];
  function pilih(k){tab=k;Array.prototype.forEach.call(tabsEl.children,function(b){b.classList.toggle('on',b.dataset.k===k);});
    document.getElementById('ket').innerHTML=T[k].k;var a=document.getElementById('aksi');a.innerHTML='';st={};
    function btn(t,f){var b=document.createElement('button');b.textContent=t;b.onclick=f;a.appendChild(b);return b;}
    if(k==='otot'){st={x:450,v:0,panah:0,dir:0};btn('◀ Tarik ke kiri',function(){st.v-=7;st.panah=40;st.dir=-1;});btn('Dorong ke kanan ▶',function(){st.v+=7;st.panah=40;st.dir=1;});btn('✋ Tahan (hentikan)',function(){st.v=0;st.panah=25;st.dir=0;});}
    if(k==='gesek'){st={x:120,v:0,p:'keramik',jarak:0};var s=document.createElement('select');Object.keys(PERMUKAAN).forEach(function(p){var o=document.createElement('option');o.value=p;o.textContent='Permukaan: '+PERMUKAAN[p][0];if(p==='keramik')o.selected=true;s.appendChild(o);});
      s.onchange=function(){st.p=s.value;st.x=120;st.v=0;};a.appendChild(s);btn('Dorong ▶ (kekuatan sama)',function(){st.x=120;st.v=16;});}
    if(k==='magnet'){st={mx:80,obj:BENDA.map(function(b,i){return {x:300+i*95,y:GROUND,b:b,v:0,nempel:false};})};
      var lab=document.createElement('label');lab.innerHTML='Geser magnet ';var r=document.createElement('input');r.type='range';r.min=60;r.max=960;r.value=80;r.oninput=function(){st.mx=+r.value;};lab.appendChild(r);a.appendChild(lab);
      btn('↺ Ulangi',function(){pilih('magnet');});}
    if(k==='gravitasi'){st={bola:{y:80,v:0},daun:{y:80,v:0,t:0},jatuh:false};btn('Lepaskan ⬇',function(){st.jatuh=true;});btn('↺ Ulangi',function(){pilih('gravitasi');});}
    if(k==='bentuk'){st={mode:'bola',f:0};btn('Tekan dari atas ⬇',function(){st.mode='tekan';});btn('Tarik ke samping ↔',function(){st.mode='tarik';});btn('↺ Bulatkan lagi',function(){st.mode='bola';});}
  }
  function kotak(px,col,label){x.fillStyle=col;x.strokeStyle='#1e293b';x.lineWidth=4;x.beginPath();x.rect(px-60,GROUND-90,120,90);x.fill();x.stroke();if(label){x.fillStyle='#fff';x.font='800 22px Segoe UI';x.textAlign='center';x.fillText(label,px,GROUND-38);}}
  function panah(x1,y,x2,col){x.strokeStyle=col;x.fillStyle=col;x.lineWidth=10;x.beginPath();x.moveTo(x1,y);x.lineTo(x2,y);x.stroke();var d=x2>x1?1:-1;x.beginPath();x.moveTo(x2+d*18,y);x.lineTo(x2,y-16);x.lineTo(x2,y+16);x.fill();}
  function teks(s,px,py,sz,col,al){x.fillStyle=col||'#0f172a';x.font='700 '+(sz||22)+'px Segoe UI';x.textAlign=al||'center';x.fillText(s,px,py);}
  function frame(){
    x.setTransform(1,0,0,1,0,0);x.clearRect(0,0,W,H);var s=Math.min(W/LW,H/LH);x.setTransform(s,0,0,s,(W-LW*s)/2,(H-LH*s)/2);
    x.fillStyle='#f8fafc';x.fillRect(0,0,LW,LH);
    var lantai='#cbd5e1';if(tab==='gesek')lantai=PERMUKAAN[st.p][1];
    x.fillStyle=lantai;x.fillRect(0,GROUND,LW,LH-GROUND);x.strokeStyle='#64748b';x.lineWidth=3;x.beginPath();x.moveTo(0,GROUND);x.lineTo(LW,GROUND);x.stroke();
    if(tab==='otot'){
      st.v*=0.985;if(Math.abs(st.v)<0.05)st.v=0;st.x+=st.v;if(st.x<70){st.x=70;st.v=0;}if(st.x>930){st.x=930;st.v=0;}
      kotak(st.x,'#f97316','KOTAK');
      if(st.panah>0){st.panah--;if(st.dir)panah(st.x-st.dir*150,GROUND-45,st.x-st.dir*70,'#2563eb');else teks('✋ ditahan',st.x,GROUND-110,26,'#2563eb');}
      teks(st.v===0?'Kotak diam':(st.v>0?'Kotak bergerak ke kanan →':'← Kotak bergerak ke kiri'),500,60,30,'#1e3a8a');
    }
    if(tab==='gesek'){
      var p=PERMUKAAN[st.p];if(st.v>0){st.v=Math.max(0,st.v-p[2]*0.35);st.x+=st.v;}if(st.x>930){st.x=930;st.v=0;}
      kotak(st.x,'#f97316','KOTAK');
      for(var m=120;m<=900;m+=60){x.fillStyle='#475569';x.fillRect(m,GROUND+8,3,14);}
      teks('Permukaan: '+p[0],500,60,30,'#1e3a8a');teks('Jarak tempuh: '+Math.round((st.x-120)/60*10)/10+' kotak',500,100,24,'#334155');
      if(st.v>0)panah(st.x+130,GROUND-45,st.x+70,'#dc2626'),teks('gaya gesek',st.x+100,GROUND-100,18,'#dc2626');
    }
    if(tab==='magnet'){
      // magnet ladam
      var mx=st.mx;x.lineWidth=26;x.strokeStyle='#dc2626';x.beginPath();x.arc(mx,GROUND-150,45,Math.PI,0);x.stroke();
      x.strokeStyle='#dc2626';x.beginPath();x.moveTo(mx-45,GROUND-150);x.lineTo(mx-45,GROUND-95);x.stroke();x.strokeStyle='#2563eb';x.beginPath();x.moveTo(mx+45,GROUND-150);x.lineTo(mx+45,GROUND-95);x.stroke();
      x.fillStyle='#e2e8f0';x.fillRect(mx-58,GROUND-95,26,14);x.fillRect(mx+32,GROUND-95,26,14);
      st.obj.forEach(function(o){
        var dx=mx-o.x;if(o.b[2]&&!o.nempel&&Math.abs(dx)<140){o.v+=dx*0.006;}
        if(o.nempel){o.x=mx+(o.x>mx?20:-20);o.y=GROUND-70;}else{o.x+=o.v;o.v*=0.9;if(o.b[2]&&Math.abs(mx-o.x)<30){o.nempel=true;}}
        x.fillStyle=o.b[1];x.strokeStyle='#1e293b';x.lineWidth=2;x.beginPath();x.rect(o.x-28,o.y-16,56,16);x.fill();x.stroke();
        if(!o.nempel)teks(o.b[0],o.x,GROUND+40,16,'#0f172a');
      });
      var n=st.obj.filter(function(o){return o.nempel;}).length;teks('Benda yang menempel pada magnet: '+n,500,50,26,'#1e3a8a');
    }
    if(tab==='gravitasi'){
      if(st.jatuh){var b=st.bola;if(b.y<GROUND-30){b.v+=0.5;b.y=Math.min(GROUND-30,b.y+b.v);}var d=st.daun;if(d.y<GROUND-12){d.t+=0.05;d.y=Math.min(GROUND-12,d.y+1.3);}}
      x.fillStyle='#2563eb';x.beginPath();x.arc(330,st.bola.y,30,0,7);x.fill();teks('bola',330,40,22);
      var dxx=Math.sin(st.daun.t)*40;x.save();x.translate(670+dxx,st.daun.y);x.rotate(Math.sin(st.daun.t)*0.5);x.fillStyle='#16a34a';x.beginPath();x.ellipse(0,0,36,14,0,0,7);x.fill();x.restore();teks('daun',670,40,22);
      x.strokeStyle='#7c3aed';x.lineWidth=8;x.beginPath();x.moveTo(150,110);x.lineTo(150,270);x.stroke();x.fillStyle='#7c3aed';x.beginPath();x.moveTo(150,295);x.lineTo(134,265);x.lineTo(166,265);x.fill();
      teks('tarikan Bumi',150,330,18,'#7c3aed');
    }
    if(tab==='bentuk'){
      var tgt=st.mode==='tekan'?1:st.mode==='tarik'?-1:0;st.f+=(tgt-st.f)*0.08;var f=st.f;
      x.fillStyle='#a855f7';x.strokeStyle='#6b21a8';x.lineWidth=4;
      var rx=90*(1+Math.max(0,f)*0.9+Math.max(0,-f)*1.4),ry=90*(1-Math.max(0,f)*0.55-Math.max(0,-f)*0.55);
      x.beginPath();x.ellipse(500,GROUND-ry,rx,ry,0,0,7);x.fill();x.stroke();
      if(st.mode==='tekan'){x.fillStyle='#fcd34d';x.fillRect(500-rx-10,GROUND-2*ry-28,2*rx+20,24);teks('⬇ ditekan',500,GROUND-2*ry-40,24,'#6b21a8');}
      if(st.mode==='tarik'){teks('✋',500-rx-30,GROUND-ry+12,46);teks('✋',500+rx+30,GROUND-ry+12,46);}
      teks(st.mode==='bola'?'Plastisin berbentuk bola':st.mode==='tekan'?'Bentuknya menjadi pipih':'Bentuknya menjadi panjang',500,60,30,'#6b21a8');
    }
    requestAnimationFrame(frame);
  }
  pilih('otot');requestAnimationFrame(frame);
})();
</script>
</body></html>
