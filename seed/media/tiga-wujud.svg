<g font-size="22" text-anchor="middle" fill="#1d2a2e">
 <text x="150" y="372" font-weight="700">Bentuk tetap</text><text x="150" y="402">Partikel rapat,</text><text x="150" y="428">hanya bergetar</text><text x="150" y="472" fill="#0369a1" font-weight="700">batu, es, kayu</text>
 <text x="450" y="372" font-weight="700">Mengikuti wadah</text><text x="450" y="402">Partikel agak renggang,</text><text x="450" y="428">bisa berpindah</text><text x="450" y="472" fill="#1d4ed8" font-weight="700">air, minyak, susu</text>
 <text x="750" y="372" font-weight="700">Memenuhi ruang</text><text x="750" y="402">Partikel sangat renggang,</text><text x="750" y="428">bergerak cepat</text><text x="750" y="472" fill="#475569" font-weight="700">udara, uap air</text>
