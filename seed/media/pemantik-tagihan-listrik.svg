  <text y="-96" text-anchor="middle" font-size="26" font-weight="900" fill="#334155">TAGIHAN</text><text y="-66" text-anchor="middle" font-size="20" font-weight="700" fill="#64748b">LISTRIK</text>
  <path d="M-80 -40 h160 M-80 -14 h120 M-80 12 h140" stroke="#cbd5e1" stroke-width="8" stroke-linecap="round"/>
