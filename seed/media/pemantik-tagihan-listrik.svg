  <circle cx="-40" cy="-20" r="30" fill="#fde047"/><path d="M20 30 l40 -60 l40 60Z" fill="#fff" opacity=".8"/>
  <rect x="-10" y="80" width="20" height="40" fill="#374151"/><rect x="-70" y="118" width="140" height="12" rx="6" fill="#374151"/>
</g>
<g transform="translate(230 440)"><rect x="-150" y="-50" width="300" height="70" rx="22" fill="#60a5fa"/><rect x="-170" y="-80" width="40" height="100" rx="16" fill="#3b82f6"/><rect x="130" y="-80" width="40" height="100" rx="16" fill="#3b82f6"/><g transform="translate(0 -10)"><rect x="-137.06" y="-17.099999999999998" width="274.12" height="28.8" rx="14.4" fill="#1e3a8a"/><text y="5.040000000000001" text-anchor="middle" font-size="18" font-weight="800" fill="#fff">Tidak ada yang menonton</text></g></g>
<g transform="translate(500 330)"><rect x="-60" y="-50" width="120" height="110" rx="34" fill="#f1f5f9" stroke="#64748b" stroke-width="5"/><ellipse cy="-50" rx="62" ry="18" fill="#e2e8f0" stroke="#64748b" stroke-width="5"/><circle class="blink" cx="30" cy="30" r="9" fill="#ef4444"/>
  <path class="rise" d="M-10 -80 q-10 -14 0 -28 q10 -14 0 -28" stroke="#94a3b8" stroke-width="5" fill="none"/><path class="rise2" d="M20 -80 q-10 -14 0 -28 q10 -14 0 -28" stroke="#94a3b8" stroke-width="5" fill="none"/></g>
<g transform="translate(730 220)" class="bob"><g transform="rotate(5)">
